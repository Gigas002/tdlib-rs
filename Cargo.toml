[workspace]
members = [
  "tdlib-rs",
  "tdlib-rs-gen",
  "tdlib-rs-parser",
]
resolver = "3"

[workspace.package]
version = "1.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Gigas002/tdlib-rs"
repository = "https://github.com/Gigas002/tdlib-rs"

[workspace.dependencies]
tdlib-rs-gen = { path = "tdlib-rs-gen", version = "1.4.0" }
tdlib-rs-parser = { path = "tdlib-rs-parser", version = "1.4.0" }
