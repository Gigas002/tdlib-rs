name: fmt and clippy

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # TDLib is not packaged for the runners, so `docs` is always enabled to skip linking tdjson
  clippy:
    strategy:
      fail-fast: false
      matrix:
        features:
          - --all-features
          - --features tdlib-rs/docs

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      - name: Clippy (${{ matrix.features }})
        run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings
