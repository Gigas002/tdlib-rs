name: CI Linux

on:
  push:
    branches-ignore: [ 'dependabot/**' ]
    tags-ignore: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_run:
    workflows: [ CD ]
    types: [ completed ]
    branches: [ main ]

env:
  GH_TOKEN: ${{ github.token }}
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]

    runs-on: ${{ matrix.os }}

    # TDLib is not packaged by Ubuntu, so CI only checks the crate without linking tdjson
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run cargo build
        run: cargo build --verbose --features docs
      - name: Run cargo test
        run: cargo test --verbose --workspace --exclude tdlib-rs -- --nocapture --test-threads=1
      - name: Run cargo clippy
        run: cargo clippy --all-targets --features docs -- -D warnings
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
